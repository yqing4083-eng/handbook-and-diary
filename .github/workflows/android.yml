name: Android build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleRelease :app:testDebugUnitTest :domain:test :feature:diary:testDebugUnitTest --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: Doki-open-source-apk
          path: app/build/outputs/apk/release/*.apk
